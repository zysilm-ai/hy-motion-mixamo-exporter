[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hy-motion-mixamo-exporter"
version = "0.2.0"
description = "CLI tool to generate Mixamo-compatible motion from text prompts using HY-Motion 1.0"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "HY-Motion Exporter Contributors"}
]
keywords = ["motion", "animation", "mixamo", "hy-motion", "text-to-motion", "3d"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

dependencies = [
    "click>=8.0",
    "requests>=2.28",
    "psutil>=5.9",
    "rich>=13.0",
    "huggingface_hub>=0.20",
    "torch>=2.0",
    "transformers>=4.40",
    "bitsandbytes>=0.43",
    "accelerate>=0.30",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "torchdiffeq>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
]

[project.scripts]
hy-motion-export = "hy_motion_exporter.cli:main"
hy-motion-uninstall = "hy_motion_exporter.cli:uninstall"

[project.urls]
Homepage = "https://github.com/hy-motion-mixamo-exporter"
Repository = "https://github.com/hy-motion-mixamo-exporter"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hy_motion_exporter = [
    "assets/**/*",
    "hymotion/**/*",
]
